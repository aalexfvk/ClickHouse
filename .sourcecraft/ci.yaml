env:
  CLICKHOUSE_UPSTREAM_REPO_URL: https://github.com/ClickHouse/ClickHouse.git

cubes:
  - name: configure-git
    script:
      - |
        git config --global user.name 'CI Bot'
        git config --global user.email 'cibot@example.com'
        echo "CLICKHOUSE_REPO_URL=https://git:$SOURCECRAFT_TOKEN@git.o.cloud.yandex.net/yc/clickhouse.git" >> $SOURCECRAFT_ENV
  - name: checkout
    env:
      GIT_SSL_NO_VERIFY: 1
    script:
      - |
        set -ex
        git clone --branch $SOURCECRAFT_COMMIT_REF_NAME $CLICKHOUSE_REPO_URL .
  - name: checkout-shallow
    env:
      GIT_SSL_NO_VERIFY: 1
    script:
      - |
        set -ex
        git clone --branch $SOURCECRAFT_COMMIT_REF_NAME --depth=1 $CLICKHOUSE_REPO_URL .

  # Parameterized cube for downloading a pre-built binary from S3.
  # Override BUILD_TYPE (e.g. amd_debug, amd_binary, amd_release) when using.
  - name: download-binary
    env:
      BUILD_TYPE: ""
    script:
      - s3cmd --config /etc/s3cmd/bucket.conf get s3://clickhouse-builds/$SOURCECRAFT_RUN_ID/$BUILD_TYPE/clickhouse

  - name: setup-sccache
    script:
      - |
        set -ex
        # Parse S3 credentials from s3cmd config for sccache
        S3_CONF="/etc/s3cmd/bucket.conf"
        if [ ! -f "$S3_CONF" ]; then
          echo "WARNING: $S3_CONF not found, sccache S3 backend will not be configured"
          exit 0
        fi

        # Disable xtrace to avoid printing secrets into logs
        { set +x; } 2>/dev/null
        S3_ACCESS_KEY=$(grep -E '^\s*access_key\s*=' "$S3_CONF" | head -1 | sed 's/.*=\s*//')
        S3_SECRET_KEY=$(grep -E '^\s*secret_key\s*=' "$S3_CONF" | head -1 | sed 's/.*=\s*//')
        S3_HOST_BASE=$(grep -E '^\s*host_base\s*=' "$S3_CONF" | head -1 | sed 's/.*=\s*//')

        # Export sccache environment variables for S3-compatible storage.
        # These will be picked up by praktika --sccache flag and passed into the Docker container.
        # sccache server is started inside Docker by build_clickhouse.py, not here.
        echo "AWS_ACCESS_KEY_ID=$S3_ACCESS_KEY" >> $SOURCECRAFT_ENV
        echo "AWS_SECRET_ACCESS_KEY=$S3_SECRET_KEY" >> $SOURCECRAFT_ENV
        echo "SCCACHE_BUCKET=clickhouse-builds" >> $SOURCECRAFT_ENV
        echo "SCCACHE_ENDPOINT=$S3_HOST_BASE" >> $SOURCECRAFT_ENV
        echo "SCCACHE_REGION=ru-central1" >> $SOURCECRAFT_ENV
        echo "SCCACHE_S3_KEY_PREFIX=ccache/sccache" >> $SOURCECRAFT_ENV
        echo "SCCACHE_S3_USE_SSL=true" >> $SOURCECRAFT_ENV
        echo "SCCACHE_IDLE_TIMEOUT=7200" >> $SOURCECRAFT_ENV
        set -x

  # Parameterized cube for building and uploading a binary.
  # Override BUILD_TYPE (e.g. amd_debug, amd_binary) when using.
  # The praktika job name is derived as "Build ($BUILD_TYPE)".
  - name: build-and-upload
    env:
      BUILD_TYPE: ""
      CLICKHOUSE_BINARY_PATH: ci/tmp/build/programs/self-extracting/clickhouse
    script:
      - |
        python3 -m ci.praktika run "Build ($BUILD_TYPE)" --sccache
        ls ci/tmp/build/programs/
      - s3cmd --config /etc/s3cmd/bucket.conf put $CLICKHOUSE_BINARY_PATH s3://clickhouse-builds/$SOURCECRAFT_RUN_ID/$BUILD_TYPE/clickhouse
      - ls -lah

  # Parameterized cube for running one integration test batch.
  # Override INTEGRATION_BATCH when using.
  - name: run-integration-test
    env:
      INTEGRATION_BATCH: ""
    script:
      - bash .sourcecraft/scripts/run_integration_test.sh $INTEGRATION_BATCH

  # Parameterized cube for running a stateless test suite.
  # Override STATELESS_TEST_NAME when using.
  - name: run-stateless-test
    env:
      STATELESS_TEST_NAME: ""
    script:
      - python3 -m ci.praktika run "$STATELESS_TEST_NAME"

# Reusable task templates.
tasks:
  # Template for build tasks. Override BUILD_TYPE via env when referencing with uses.
  - name: build-task
    runs_on: [self-hosted, large]
    checkout:
      enabled: false
    env:
      GIT_SSL_NO_VERIFY: 1
      BUILD_TYPE: ""
    cubes:
      - name: configure-git
        uses: configure-git
      - name: checkout
        uses: checkout-shallow
      - name: setup-sccache
        uses: setup-sccache
      - name: build-and-upload
        env:
          BUILD_TYPE: $BUILD_TYPE
        uses: build-and-upload

  # Template for stateless test tasks. Override STATELESS_TEST_NAME via env when referencing with uses.
  - name: stateless-test
    checkout:
      enabled: false
    env:
      GIT_SSL_NO_VERIFY: 1
      STATELESS_TEST_NAME: ""
    cubes:
      - name: configure-git
        uses: configure-git
      - name: checkout
        uses: checkout-shallow
      - name: download-binary
        env:
          BUILD_TYPE: amd_debug
        uses: download-binary
      - name: run
        env:
          STATELESS_TEST_NAME: $STATELESS_TEST_NAME
        uses: run-stateless-test

  # Template for integration test batches. Override INTEGRATION_BATCH via env when referencing with uses.
  - name: integration-test-batch
    runs_on: [self-hosted, medium]
    checkout:
      enabled: false
    env:
      GIT_SSL_NO_VERIFY: 1
      TEST_SESSION_TIMEOUT: 10800
      INTEGRATION_BATCH: ""
    cubes:
      - name: configure-git
        uses: configure-git
      - name: checkout
        uses: checkout-shallow
      - name: download-binary
        env:
          BUILD_TYPE: amd_binary
        uses: download-binary
      - name: run
        env:
          INTEGRATION_BATCH: $INTEGRATION_BATCH
        uses: run-integration-test

on:
  schedule:
    - workflows: sync_upstream
      cron: "0 9 * * *"
      description: "every day at 9:00 AM"
    - workflows: auto_rebase_check
      cron: "30 9 * * *"
      description: "auto rebase check, runs 30 min after sync_upstream"

  pull_request:
    - workflows: [tests_workflow]
      filter:
        target_branches: ["yc/master"]
    - workflows: [tests_workflow]
      filter:
        source_branches: "yc/rebase/**"
        target_branches: ["yc/**"]
    - workflows: [tests_workflow]
      filter:
        source_branches: ["yc/backport/**"]
        target_branches: ["yc/**"]


workflows:
  sync_upstream:
    tasks:
      - name: sync-upstream
        cubes:
          - name: sync-upstream
            env:
              GIT_SSL_NO_VERIFY: 1
            script:
              - bash .sourcecraft/scripts/sync_upstream.sh


  backport:
    inputs:
      target_branch:
        description: 'Target Release Branch (e.g. yc/25.12)'
        required: true
        type: string
      commit_sha:
        description: 'Commit SHA from yc/master to cherry-pick'
        required: true
        type: string
      # original_pr:
      #   description: 'Original PR Number (for naming only)'
      #   required: false
      #   default: 'manual'
      #   type: string
    
    tasks:
      - name: backport
        checkout:
          enabled: false
        env:
          GIT_SSL_NO_VERIFY: 1
        cubes:
          - name: configure-git
            uses: configure-git
          
          - name: checkout
            uses: checkout

          - name: prepare-branch
            script:
              - bash .sourcecraft/scripts/backport_prepare_branch.sh "${{ inputs.target_branch }}" "${{ inputs.commit_sha }}"
          - name: cherry-pick
            script:
              - bash .sourcecraft/scripts/backport_cherry_pick.sh "${{ inputs.commit_sha }}"
          - name: push
            script:
              - |
                set -ex
                BP_BRANCH="$bp_branch"
                echo "Pushing $BP_BRANCH..."
                git push origin "$BP_BRANCH" --force

          - name: create-backport-pr
            script:
              - bash .sourcecraft/scripts/backport_create_pr.sh "${{ inputs.target_branch }}" "${{ inputs.commit_sha }}"



  init_release_branch:
    inputs:
      upstream_tag:
        description: 'Upstream tag to base the new branch on (e.g. v25.12.1.1-stable)'
        required: true
        type: string
      new_branch_name:
        description: 'Name of the new YC release branch (e.g. yc/25.12). Auto-generated from upstream_tag if not set.'
        required: false
        type: string

    tasks:
      - name: init-branch
        checkout:
          enabled: false
        env:
          GIT_SSL_NO_VERIFY: 1
        cubes:
          - name: configure-git
            uses: configure-git

          - name: checkout
            script:
              - |
                set -ex
                # Clone from yc/master — it is the source of our patches
                git clone --branch yc/master $CLICKHOUSE_REPO_URL .
                git checkout $SOURCECRAFT_COMMIT_REF

          - name: validate-inputs
            script:
              - bash .sourcecraft/scripts/init_release_branch_validate.sh "${{ inputs.upstream_tag }}" "${{ inputs.new_branch_name }}"

          - name: detect-patch-base
            script:
              - bash .sourcecraft/scripts/init_release_branch_detect_base.sh

          - name: create-release-branch
            script:
              - bash .sourcecraft/scripts/init_release_branch_create.sh "${{ inputs.upstream_tag }}"

          - name: push-release-branch
            script:
              - |
                set -ex
                NEW_BRANCH="$new_branch"

                git push origin "HEAD:refs/heads/$NEW_BRANCH"
                echo "✅ Release branch $NEW_BRANCH created successfully."
                echo "   Next step: run create_release to tag and publish a release."


  create_release:
    inputs:
      source_branch:
        description: 'Release branch to tag (e.g. yc/25.12). Create it first with init_release_branch.'
        required: true
        type: string
    
    tasks:
      - name: release
        checkout:
          enabled: false
        env:
          GIT_SSL_NO_VERIFY: 1
        cubes:
          - name: configure-git
            uses: configure-git
          
          - name: checkout
            script:
              - |
                set -ex
                SOURCE_BRANCH="${{ inputs.source_branch }}"
                git clone --branch "$SOURCE_BRANCH" --single-branch $CLICKHOUSE_REPO_URL .
                # Fetch tags so that read-version can check if the tag already exists
                git fetch --tags

          - name: validate-branch
            script:
              - bash .sourcecraft/scripts/create_release_validate.sh "${{ inputs.source_branch }}"

          - name: compute-version
            script:
              - bash .sourcecraft/scripts/create_release_compute_version.sh

          - name: finalize
            script:
              - |
                set -ex
                echo "---- Tagging release ----"
                git tag -a "$ver" -m "Release $ver" "$sha"
                git push origin "$ver"

                echo "✅ Release $ver published."


  apply_rebase_candidate:
    inputs:
        candidate_branch:
          description: 'Ready branch (e.g. yc/rebase/master/v26...)'
          required: true
          type: string
        target_branch:
          description: 'Target branch to overwrite (e.g. yc/master)'
          required: true
          default: 'yc/master'
          type: string
        pr_number:
          description: 'PR number to close (optional)'
          required: false
          type: string

    tasks:
      - name: replace-branch
        checkout:
          enabled: false
        env:
          GIT_SSL_NO_VERIFY: 1
        cubes:
          - name: configure-git
            uses: configure-git

          - name: clone-repo
            script:
              - |
                set -ex
                git clone --depth=1 $CLICKHOUSE_REPO_URL .
                git fetch --tags --quiet

          - name: validate-and-replace
            script:
              - bash .sourcecraft/scripts/apply_rebase_candidate.sh "${{ inputs.candidate_branch }}" "${{ inputs.target_branch }}" "${{ inputs.pr_number }}"

  create_rebase_pr:
    inputs:
        target_branch:
          description: 'Branch for rebasing (e.g. yc/master or yc/25.12)'
          required: true
          default: 'yc/master'
          type: string
        upstream_tag:
          description: 'Upstream tag to rebase onto (e.g. v25.12.5.6-stable)'
          required: true
          type: string
        force_update:
          description: 'Force recreate the candidate branch even if it exists'
          required: false
          default: 'false'
          type: string

    tasks:
      - name: create-candidate
        checkout:
          enabled: false
        env:
          GIT_SSL_NO_VERIFY: 1
        cubes:
          - name: configure-git
            uses: configure-git

          - name: checkout
            script:
              - |
                set -ex
                # Clone the exact target branch — source of our patches
                git clone --branch "${{ inputs.target_branch }}" $CLICKHOUSE_REPO_URL .
                # Fetch all tags so that git describe and git rev-parse work correctly
                git fetch --tags

          - name: validation-upstream-tag
            script:
              - |
                set -ex
                if ! git rev-parse "${{ inputs.upstream_tag }}" >/dev/null 2>&1; then
                  echo "::error::Tag ${{ inputs.upstream_tag }} not found. Run sync_upstream first."
                  exit 1
                fi
          - name: detect-old-base
            script:
              - bash .sourcecraft/scripts/create_rebase_pr_detect_old_base.sh "${{ inputs.upstream_tag }}"

          - name: check-if-candidate-exist
            script:
              - bash .sourcecraft/scripts/create_rebase_pr_check_candidate.sh "${{ inputs.upstream_tag }}" "${{ inputs.target_branch }}" "${{ inputs.force_update }}"

          - name: checkout-candidate
            script:
              - |
                set -ex
                if [ "$skip_rebase" == "true" ]; then
                   git checkout -b "$candidate_name" "origin/$candidate_name"
                else
                   git checkout -B "$candidate_name"
                fi
          - name: do-rebase
            script:
              - |
                set -ex
                if [ "$skip_rebase" == "true" ]; then
                   exit 0
                fi

                if git rebase --onto "${{ inputs.upstream_tag }}" "$old_base" "$candidate_name"; then
                  echo "Rebase is done successfully."
                else
                  echo "::error::Rebase failed due to conflicts."
                  git rebase --abort
                  exit 1
                fi
          - name: push-rebase-branch
            script:
                - |
                  set -ex
                  if [ "$skip_rebase" == "true" ]; then
                    exit 0
                  fi
                  git push origin "$candidate_name" --force
          - name: create-rebase-pr
            script:
              - bash .sourcecraft/scripts/create_rebase_pr_create_pr.sh "${{ inputs.target_branch }}" "${{ inputs.upstream_tag }}"

  auto_rebase_check:
    inputs:
      target_branch:
        description: 'Branch to rebase (e.g. yc/master, yc/25.12) or "all" for all yc/* branches'
        required: false
        default: 'all'
        type: string
      create_pr:
        description: 'Create candidate branch and PR (true = full rebase + PR, false = dry-run check only)'
        required: false
        default: 'false'
        type: string

    tasks:
      - name: rebase-check
        checkout:
          enabled: false
        env:
          GIT_SSL_NO_VERIFY: 1
          INPUT_BRANCH: ${{ inputs.target_branch }}
          CREATE_PR: ${{ inputs.create_pr }}
        cubes:
          - name: configure-git
            uses: configure-git

          - name: clone-repo
            script:
              - |
                set -euo pipefail
                git clone $CLICKHOUSE_REPO_URL .
                git fetch --tags --quiet

          - name: run-rebase-loop
            script:
              - bash .sourcecraft/scripts/auto_rebase_check.sh

  do_rebase_poller:
    tasks:
      - name: poll-and-apply
        checkout:
          enabled: false
        env:
          GIT_SSL_NO_VERIFY: 1
          API_BASE: https://public-api.o.cloud.yandex.net
          ORG_SLUG: yc
          REPO_SLUG: clickhouse
          REBASE_LABEL: do-rebase
        cubes:
          - name: configure-git
            uses: configure-git
          - name: clone-repo
            script:
              - |
                set -ex
                git clone --depth=1 --branch yc/master $CLICKHOUSE_REPO_URL .

          - name: run-poller
            script:
              - python3 .sourcecraft/scripts/do_rebase_poller.py

  fast_test_workflow:
    runs_on: self-hosted
    settings:
      max_cube_duration: 6h
    tasks:
      - name: fast_test
        checkout:
          enabled: false
        env:
          GIT_SSL_NO_VERIFY: 1
        cubes:
          - name: configure-git
            uses: configure-git
          
          - name: checkout
            script:
              - |
                set -ex
                git clone --depth=1 --branch yc/master $CLICKHOUSE_REPO_URL .
                git checkout $SOURCECRAFT_COMMIT_REF

          - name: fast_test
            script:
              - python3 -m ci.praktika run "Fast test"

  tests_workflow:
    runs_on: self-hosted
    settings:
      max_cube_duration: 6h
    tasks:
      - name: style-check
        checkout:
          enabled: false
        env:
          GIT_SSL_NO_VERIFY: 1
        cubes:
          - name: configure-git
            uses: configure-git
          - name: checkout
            uses: checkout-shallow
          - name: style-check
            script:
              - python3 -m ci.praktika run "Style check"

      - name: build_amd_debug
        uses: build-task
        needs: [style-check]
        env:
          BUILD_TYPE: amd_debug

      - name: build_amd_binary
        uses: build-task
        needs: [style-check]
        env:
          BUILD_TYPE: amd_binary

      - name: stateless-tests-debug-distributed-plan-s3-parallel
        uses: stateless-test
        needs: [build_amd_debug]
        env:
          STATELESS_TEST_NAME: "Stateless tests (amd_debug, distributed plan, s3 storage, parallel)"

      - name: stateless-tests-debug-distributed-plan-s3-sequential
        uses: stateless-test
        needs: [build_amd_debug]
        env:
          STATELESS_TEST_NAME: "Stateless tests (amd_debug, distributed plan, s3 storage, sequential)"

      - name: stateless-tests-debug-async-insert-s3-parallel
        uses: stateless-test
        needs: [build_amd_debug]
        env:
          STATELESS_TEST_NAME: "Stateless tests (amd_debug, AsyncInsert, s3 storage, parallel)"

      - name: stateless-tests-debug-async-insert-s3-sequential
        uses: stateless-test
        needs: [build_amd_debug]
        env:
          STATELESS_TEST_NAME: "Stateless tests (amd_debug, AsyncInsert, s3 storage, sequential)"

      - name: stateless-tests-debug-parallel
        uses: stateless-test
        needs: [build_amd_debug]
        env:
          STATELESS_TEST_NAME: "Stateless tests (amd_debug, parallel)"

      # Reason: Fails on azure_cache related tests, because azurit is not started for local tests
      # - name: stateless-tests-debug-sequential
      #   uses: stateless-test
      #   needs: [build_amd_debug]
      #   env:
      #     STATELESS_TEST_NAME: "Stateless tests (amd_debug, sequential)"

      - name: integration-tests-1
        uses: integration-test-batch
        needs: [build_amd_binary]
        env:
          INTEGRATION_BATCH: 1

      - name: integration-tests-2
        uses: integration-test-batch
        needs: [build_amd_binary]
        env:
          INTEGRATION_BATCH: 2

      - name: integration-tests-3
        uses: integration-test-batch
        needs: [build_amd_binary]
        env:
          INTEGRATION_BATCH: 3

      - name: integration-tests-4
        uses: integration-test-batch
        needs: [build_amd_binary]
        env:
          INTEGRATION_BATCH: 4

      - name: integration-tests-5
        uses: integration-test-batch
        needs: [build_amd_binary]
        env:
          INTEGRATION_BATCH: 5
