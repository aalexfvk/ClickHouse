  test_checkout_cache:
    runs_on: [self-hosted, ultrasmall]
    inputs:
      branch:
        description: 'Branch to check out (e.g. yc/master, yc/25.8)'
        required: true
        type: string
        default: 'yc/master'

    tasks:
      - name: test-checkout-cache
        checkout:
          enabled: false
        env:
          GIT_SSL_NO_VERIFY: 1
          SOURCECRAFT_COMMIT_REF_NAME: ${{ inputs.branch }}
        cubes:
          - name: configure-git
            uses: configure-git

          - name: checkout
            uses: checkout-with-cache

          - name: describe
            script:
              - |
                set -ex
                git describe --tags --match 'v*' --abbrev=0
