cubes:
  - name: test-cube-1
    script:
      - |
        git config --global user.name 'CI Bot'
        git config --global user.email 'cibot@example.com'
  - name: configure-git
    script:
      - |
        git config --global user.name 'CI Bot'
        git config --global user.email 'cibot@example.com'
  - name: checkout
    env:
      GIT_SSL_NO_VERIFY: 1
    script:
      - |
        set -ex
        git clone --branch $SOURCECRAFT_COMMIT_REF_NAME https://git:$SOURCECRAFT_TOKEN@git.o.cloud.yandex.net/yc/clickhouse.git .
  - name: checkout-shallow
    env:
      GIT_SSL_NO_VERIFY: 1
    script:
      - |
        set -ex
        git clone --branch $SOURCECRAFT_COMMIT_REF_NAME --depth=1 https://git:$SOURCECRAFT_TOKEN@git.o.cloud.yandex.net/yc/clickhouse.git .
  - name: download_amd_debug
    script:
      - s3cmd --config /etc/s3cmd/bucket.conf get s3://clickhouse-builds/$SOURCECRAFT_RUN_ID/amd_debug/clickhouse
  - name: download_amd_binary
    script:
      - s3cmd --config /etc/s3cmd/bucket.conf get s3://clickhouse-builds/$SOURCECRAFT_RUN_ID/amd_binary/clickhouse
  - name: download-binary-amd_release
    script:
      - s3cmd --config /etc/s3cmd/bucket.conf get s3://clickhouse-builds/$SOURCECRAFT_RUN_ID/amd_release/clickhouse
  - name: setup-sccache
    script:
      - |
        set -ex
        # Parse S3 credentials from s3cmd config for sccache
        S3_CONF="/etc/s3cmd/bucket.conf"
        if [ ! -f "$S3_CONF" ]; then
          echo "WARNING: $S3_CONF not found, sccache S3 backend will not be configured"
          exit 0
        fi

        # Disable xtrace to avoid printing secrets into logs
        { set +x; } 2>/dev/null
        S3_ACCESS_KEY=$(grep -E '^\s*access_key\s*=' "$S3_CONF" | head -1 | sed 's/.*=\s*//')
        S3_SECRET_KEY=$(grep -E '^\s*secret_key\s*=' "$S3_CONF" | head -1 | sed 's/.*=\s*//')
        S3_HOST_BASE=$(grep -E '^\s*host_base\s*=' "$S3_CONF" | head -1 | sed 's/.*=\s*//')

        # Export sccache environment variables for S3-compatible storage.
        # These will be picked up by praktika --sccache flag and passed into the Docker container.
        # sccache server is started inside Docker by build_clickhouse.py, not here.
        echo "AWS_ACCESS_KEY_ID=$S3_ACCESS_KEY" >> $SOURCECRAFT_ENV
        echo "AWS_SECRET_ACCESS_KEY=$S3_SECRET_KEY" >> $SOURCECRAFT_ENV
        echo "SCCACHE_BUCKET=clickhouse-builds" >> $SOURCECRAFT_ENV
        echo "SCCACHE_ENDPOINT=$S3_HOST_BASE" >> $SOURCECRAFT_ENV
        echo "SCCACHE_REGION=ru-central1" >> $SOURCECRAFT_ENV
        echo "SCCACHE_S3_KEY_PREFIX=ccache/sccache" >> $SOURCECRAFT_ENV
        echo "SCCACHE_S3_USE_SSL=true" >> $SOURCECRAFT_ENV
        echo "SCCACHE_IDLE_TIMEOUT=7200" >> $SOURCECRAFT_ENV
        set -x

on:
  schedule:
    - workflows: sync_upstream
      cron: "0 9 * * *"
      description: "every day at 9:00 AM"
    - workflows: auto_rebase_check
      cron: "30 9 * * *"
      description: "auto rebase check, runs 30 min after sync_upstream"
    - workflows: do_rebase_poller
      cron: "*/2 * * * *"
      description: "poll open PRs every 2 min and apply rebase if do-rebase label is set"

  # push:
  #   - workflows: [tests_workflow]
  #     filter:
  #       branches: ["yc/rebase/**"]

  pull_request:
    - workflows: [tests_workflow]
      filter:
        target_branches: ["yc/master"]

  pull_request:
    - workflows: [tests_workflow]
      filter:
        source_branches: "yc/rebase/**"
        target_branches: ["yc/**"]
  
  pull_request:
    - workflows: [tests_workflow]
      filter:
        source_branches: ["yc/backport/**"]
        target_branches: ["yc/**"]
  

workflows:
  sync_upstream:
    tasks:
      - name: sync-upstream
        cubes:
          - name: sync-upstream
            env:
              GIT_SSL_NO_VERIFY: 1
              CLICKHOUSE_UPSTREAM_REPO: https://github.com/ClickHouse/ClickHouse.git
            script:
              - |
                set -ex
                git remote add upstream ${CLICKHOUSE_UPSTREAM_REPO}
                
                # 1. Dynamically generate the list of refspecs for master and release branches (25.12, 26.1, etc.)
                #    - git ls-remote --heads upstream : retrieves the list of all remote branches
                #    - awk '{print $2}' : keeps only the ref names (e.g., refs/heads/master, refs/heads/24.3)
                #    - grep -E ... : filters only 'master' and release branches (format: digit.digit)
                #    - awk ... : converts them to the fetch refspec format "+refs/heads/NAME:refs/remotes/upstream/NAME"
                REF_SPECS=$(git ls-remote --heads upstream | \
                awk '{print $2}' | \
                grep -E 'refs/heads/(master|[0-9]+\.[0-9]+)$' | \
                awk -F/ '{print "+"$0":refs/remotes/upstream/"$3}' | \
                tr '\n' ' ')

                # 2. Execute fetch with the substituted list of branches.
                git fetch upstream --tags --quiet $REF_SPECS 2>&1 | grep -vE "multiple configurations|Skipping second one" || true

                # 3. Push to origin
                git push origin "refs/remotes/upstream/*:refs/heads/*" --force
                git push origin --tags --force


  backport:
    inputs:
      target_branch:
        description: 'Target Release Branch (e.g. yc/25.12)'
        required: true
        type: string
      commit_sha:
        description: 'Commit SHA from yc/master to cherry-pick'
        required: true
        type: string
      # original_pr:
      #   description: 'Original PR Number (for naming only)'
      #   required: false
      #   default: 'manual'
      #   type: string
    
    tasks:
      - name: backport
        checkout:
          enabled: false
        env:
          GIT_SSL_NO_VERIFY: 1
        cubes:
          - name: configure-git
            script:
              - |
                git config --global user.name 'CI Bot'
                git config --global user.email 'cibot@example.com'
          
          - name: checkout
            uses: checkout

          - name: prepare-branch
            script:
              - |
                set -ex
                TARGET="${{ inputs.target_branch }}"
                SHA="${{ inputs.commit_sha }}"

                echo "Backporting commit $SHA to $TARGET..."

                git fetch origin "$TARGET"
                # git checkout "$TARGET"
                git checkout -b "$TARGET" origin/$TARGET

                # Strip leading 'yc/' from target branch name: yc/25.12 → 25.12
                SAFE_TARGET=$(echo "$TARGET" | sed 's|^yc/||')
                BP_BRANCH="yc/backport/${SAFE_TARGET}/${SHA::7}"

                echo "Creating branch: $BP_BRANCH"                
                git checkout -b "$BP_BRANCH"

                echo "bp_branch=$BP_BRANCH" >> $SOURCECRAFT_ENV
          - name: cherry-pick
            script:
              - |
                set -ex
                SHA="${{ inputs.commit_sha }}"

                git fetch origin "$SHA"

                # '-x' adds "(cherry picked from commit ...)" to description
                if git cherry-pick -x "$SHA"; then
                  echo "✅ Cherry-pick successful."
                else
                  echo "::error::Cherry-pick failed due to conflicts."
                  echo "::error::Automatic backport is not possible."
                  echo "::notice::Please perform manual backport locally."
                  git cherry-pick --abort
                  exit 1
                fi
          - name: push
            script:
              - |
                set -ex
                TARGET="${{ inputs.target_branch }}"
                BP_BRANCH="$bp_branch"
                SHA="${{ inputs.commit_sha }}"

                echo "Pushing $BP_BRANCH..."
                git push origin "$BP_BRANCH" --force

          - name: create-backport-pr
            script:
              - |
                set -ex
                TARGET="${{ inputs.target_branch }}"
                BP_BRANCH="$bp_branch"
                SHA="${{ inputs.commit_sha }}"

                TITLE="[Backport $TARGET] Cherry-pick $SHA"
                DESC="Backport of commit $SHA to $TARGET."

                curl --insecure -X POST \
                  -H "Authorization: Bearer $SOURCECRAFT_TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "{
                    \"source_branch\": \"$BP_BRANCH\",
                    \"target_branch\": \"$TARGET\",
                    \"title\": \"$TITLE\",
                    \"description\": \"$DESC\",
                    \"publish\": true
                  }" \
                  "https://public-api.o.cloud.yandex.net/repos/yc/clickhouse/pulls"



  init_release_branch:
    inputs:
      upstream_tag:
        description: 'Upstream tag to base the new branch on (e.g. v25.12.1.1-stable)'
        required: true
        type: string
      new_branch_name:
        description: 'Name of the new YC release branch (e.g. yc/25.12). Auto-generated from upstream_tag if not set.'
        required: false
        type: string

    tasks:
      - name: init-branch
        checkout:
          enabled: false
        env:
          GIT_SSL_NO_VERIFY: 1
        cubes:
          - name: configure-git
            script:
              - |
                git config --global user.name 'CI Bot'
                git config --global user.email 'cibot@example.com'

          - name: checkout
            script:
              - |
                set -ex
                # Clone from yc/master — it is the source of our patches
                git clone --branch yc/master https://git:$SOURCECRAFT_TOKEN@git.o.cloud.yandex.net/yc/clickhouse.git .
                git checkout $SOURCECRAFT_COMMIT_REF

          - name: validate-inputs
            script:
              - |
                set -ex
                TAG="${{ inputs.upstream_tag }}"

                # Auto-generate branch name from tag if not provided:
                # v25.12.6.38-stable → yc/25.12
                if [ -n "${{ inputs.new_branch_name }}" ]; then
                  NEW_BRANCH="${{ inputs.new_branch_name }}"
                else
                  # Strip leading 'v', extract MAJOR.MINOR (first two numeric components)
                  NEW_BRANCH="yc/$(echo "${TAG#v}" | grep -oE '^[0-9]+\.[0-9]+')"
                fi

                echo "Target branch: $NEW_BRANCH"
                echo "new_branch=$NEW_BRANCH" >> $SOURCECRAFT_ENV

                # Upstream tag must exist (synced via sync_upstream)
                if ! git rev-parse "$TAG" >/dev/null 2>&1; then
                  echo "::error::Tag $TAG not found. Run sync_upstream first."
                  exit 1
                fi

                # Target branch must NOT exist yet
                if git ls-remote --exit-code --heads origin "$NEW_BRANCH" >/dev/null 2>&1; then
                  echo "::error::Branch $NEW_BRANCH already exists."
                  echo "::error::To update an existing release branch, use create_rebase_pr instead."
                  exit 1
                fi

          - name: detect-patch-base
            script:
              - |
                set -ex
                # Find the most recent upstream tag reachable from yc/master HEAD.
                # This is the "old base" — the tag our patches currently sit on top of.
                # "--match v*" matches only upstream tags (e.g. v25.12.1.1-stable).
                # Our own release tags intentionally have no leading 'v' (e.g. 25.12.1.1-stable-yc.1)
                # so they are never picked up here.
                OLD_BASE=$(git describe --tags --abbrev=0 --match "v*" HEAD)
                echo "Current patch base in yc/master: $OLD_BASE"
                echo "old_base=$OLD_BASE" >> $SOURCECRAFT_ENV

          - name: create-release-branch
            script:
              - |
                set -ex
                TAG="${{ inputs.upstream_tag }}"
                NEW_BRANCH="$new_branch"

                # Create the target branch from current HEAD (yc/master with our patches)
                git checkout -b "$NEW_BRANCH"

                # Rebase our patches (old_base..NEW_BRANCH) onto the target upstream tag.
                # --onto TARGET OLD_BASE CURRENT_BRANCH
                # Takes all commits between old_base and HEAD, replays them on top of TAG.
                if git rebase --onto "$TAG" "$old_base" "$NEW_BRANCH"; then
                  echo "✅ Rebase successful. Patches applied on top of $TAG."
                else
                  echo "::error::Rebase failed due to conflicts."
                  echo "::error::Manual intervention required: rebase yc/master onto $TAG locally,"
                  echo "::error::resolve conflicts, then push as $NEW_BRANCH manually."
                  git rebase --abort
                  exit 1
                fi

          - name: push-release-branch
            script:
              - |
                set -ex
                NEW_BRANCH="$new_branch"

                git push origin "HEAD:refs/heads/$NEW_BRANCH"
                echo "✅ Release branch $NEW_BRANCH created successfully."
                echo "   Next step: run create_release to tag and publish a release."


  create_release:
    inputs:
      source_branch:
        description: 'Release branch to tag (e.g. yc/25.12). Create it first with init_release_branch.'
        required: true
        type: string
    
    tasks:
      - name: release
        checkout:
          enabled: false
        env:
          GIT_SSL_NO_VERIFY: 1
        cubes:
          - name: configure-git
            script:
              - |
                git config --global user.name 'CI Bot'
                git config --global user.email 'cibot@example.com'
          
          - name: checkout
            script:
              - |
                set -ex
                SOURCE_BRANCH="${{ inputs.source_branch }}"
                git clone --branch "$SOURCE_BRANCH" --single-branch https://git:$SOURCECRAFT_TOKEN@git.o.cloud.yandex.net/yc/clickhouse.git .
                # Fetch tags so that read-version can check if the tag already exists
                git fetch --tags

          - name: validate-branch
            script:
              - |
                set -ex
                SOURCE_BRANCH="${{ inputs.source_branch }}"

                # Release branches must follow the yc/XX.YY pattern
                if ! echo "$SOURCE_BRANCH" | grep -qE '^yc/[0-9]+\.[0-9]+$'; then
                  echo "::error::Invalid branch: $SOURCE_BRANCH"
                  echo "::error::Only release branches matching yc/XX.YY are allowed."
                  echo "::error::To create a new release branch, use init_release_branch first."
                  exit 1
                fi

                if ! git ls-remote --exit-code --heads origin "$SOURCE_BRANCH" >/dev/null 2>&1; then
                  echo "::error::Branch $SOURCE_BRANCH does not exist on remote."
                  echo "::error::Create it first with init_release_branch."
                  exit 1
                fi

                echo "target_branch=$SOURCE_BRANCH" >> $SOURCECRAFT_ENV

          - name: compute-version
            script:
              - |
                set -ex

                # Find the latest upstream tag reachable from HEAD (e.g. v25.12.7.21-stable).
                # Our own tags have no leading 'v', so --match "v*" skips them.
                UPSTREAM_TAG=$(git describe --tags --abbrev=0 --match "v*" HEAD)
                # Strip leading 'v': v25.12.7.21-stable → 25.12.7.21-stable
                UPSTREAM_VER="${UPSTREAM_TAG#v}"

                # Find the latest our yc tag reachable from HEAD (e.g. 25.12.7.21-stable-yc.2).
                # If none exists yet — this is the first release on this upstream base.
                LAST_YC_TAG=$(git describe --tags --abbrev=0 --match "*-yc.*" HEAD 2>/dev/null || true)

                if [ -n "$LAST_YC_TAG" ] && [[ "$LAST_YC_TAG" == "${UPSTREAM_VER}-yc."* ]]; then
                  # Same upstream base — increment the yc counter
                  LAST_NUM="${LAST_YC_TAG##*-yc.}"
                  NEXT_NUM=$((LAST_NUM + 1))
                else
                  # New upstream base or no yc tags yet — start from 1
                  NEXT_NUM=1
                fi

                RELEASE_VER="${UPSTREAM_VER}-yc.${NEXT_NUM}"

                if git rev-parse "$RELEASE_VER" >/dev/null 2>&1; then
                  echo "::error::Tag $RELEASE_VER already exists (race condition?). Re-run the workflow."
                  exit 1
                fi

                echo "Computed release version: $RELEASE_VER"
                echo "ver=$RELEASE_VER" >> $SOURCECRAFT_ENV

                SHA=$(git rev-parse HEAD)
                echo "sha=$SHA" >> $SOURCECRAFT_ENV

          - name: finalize
            script:
              - |
                set -ex
                echo "---- Tagging release ----"
                git tag -a "$ver" -m "Release $ver" "$sha"
                git push origin "$ver"

                echo "✅ Release $ver published."


  apply_rebase_candidate:
    inputs:
        candidate_branch:
          description: 'Ready branch (e.g. yc/rebase/master/v26...)'
          required: true
          type: string
        target_branch:
          description: 'Target branch to overwrite (e.g. yc/master)'
          required: true
          default: 'yc/master'
          type: string
        pr_number:
          description: 'PR number to close (optional)'
          required: false
          type: string

    tasks:
      - name: replace-branch
        env:
          GIT_SSL_NO_VERIFY: 1
        cubes:
          - name: validate-and-replace
            script:
              - |
                set -ex
                git config --global user.name 'CI Bot'
                git config --global user.email 'cibot@example.com'

                CANDIDATE="${{ inputs.candidate_branch }}"
                TARGET="${{ inputs.target_branch }}"

                echo "🔍 Resolving SHA for candidate: $CANDIDATE"

                CANDIDATE_SHA=$(git ls-remote --heads origin "$CANDIDATE" | awk '{print $1}')

                if [ -z "$CANDIDATE_SHA" ]; then
                   echo "::error::Branch '$CANDIDATE' not found on remote origin."
                   exit 1
                fi

                echo "🎯 Candidate SHA: $CANDIDATE_SHA"
                echo "🚨 ATTENTION: Force updating '$TARGET' to match '$CANDIDATE'"

                git push origin "$CANDIDATE_SHA:refs/heads/$TARGET" --force
                echo "✅ Success. '$TARGET' is now at $CANDIDATE_SHA"

          - name: delete-candidate-branch
            script:
              - |
                set -ex
                echo "Removing candidate branch..."
                git push origin --delete "${{ inputs.candidate_branch }}" || true

  create_rebase_pr:
    inputs:
        target_branch:
          description: 'Branch for rebasing (e.g. yc/master or yc/25.12)'
          required: true
          default: 'yc/master'
          type: string
        upstream_tag:
          description: 'Upstream tag to rebase onto (e.g. v25.12.5.6-stable)'
          required: true
          type: string

    tasks:
      - name: create-candidate
        checkout:
          enabled: false
        env:
          GIT_SSL_NO_VERIFY: 1
        cubes:
          - name: configure-git
            script:
              - |
                git config --global user.name 'CI Bot'
                git config --global user.email 'cibot@example.com'

          - name: checkout
            script:
              - |
                set -ex
                # Clone the exact target branch — source of our patches
                git clone --branch "${{ inputs.target_branch }}" https://git:$SOURCECRAFT_TOKEN@git.o.cloud.yandex.net/yc/clickhouse.git .
                # Fetch all tags so that git describe and git rev-parse work correctly
                git fetch --tags

          - name: validation-upstream-tag
            script:
              - |
                set -ex
                if ! git rev-parse "${{ inputs.upstream_tag }}" >/dev/null 2>&1; then
                  echo "::error::Tag ${{ inputs.upstream_tag }} not found. Run sync_upstream first."
                  exit 1
                fi
          - name: detect-old-base
            script:
              - |
                set -ex
                # "--match v*" matches only upstream tags (e.g. v25.12.1.1-stable).
                # Our own release tags intentionally have no leading 'v' (e.g. 25.12.1.1-stable-yc.1)
                # so they are never picked up here.
                OLD_BASE=$(git describe --tags --abbrev=0 --match "v*" HEAD)
                echo "Current base determined as: $OLD_BASE"

                # Is already rebased
                if [ "$OLD_BASE" == "${{ inputs.upstream_tag }}" ]; then
                  echo "::error::Branch is already based on ${{ inputs.upstream_tag }}."
                  exit 1
                fi

                # Is new tag ancestor of old base
                if git merge-base --is-ancestor "${{ inputs.upstream_tag }}" HEAD; then
                  echo "::warning::Tag ${{ inputs.upstream_tag }} is already merged into history."
                  exit 1
                fi

                echo "old_base=$OLD_BASE" >> $SOURCECRAFT_ENV

          - name: check-if-candidate-exist
            script:
              - |
                set -ex
                SAFE_TAG=$(echo "${{ inputs.upstream_tag }}" | sed 's/[^a-zA-Z0-9.-]//g')
                # Strip leading 'yc/' from target branch name: yc/master → master, yc/25.12 → 25.12
                SAFE_TARGET=$(echo "${{ inputs.target_branch }}" | sed 's|^yc/||')

                CANDIDATE_NAME="yc/rebase/${SAFE_TARGET}/${SAFE_TAG}"
                echo "candidate_name=$CANDIDATE_NAME" >> $SOURCECRAFT_ENV

                SKIP_REBASE="false"

                if git ls-remote --exit-code --heads origin "$CANDIDATE_NAME"; then
                   echo "🔍 Candidate branch exists in remote. Checking its base..."
                   git fetch origin "$CANDIDATE_NAME"
                   
                   # Check latest upstream tag on the candidate branch (same convention as detect-old-base)
                   CANDIDATE_BASE=$(git describe --tags --abbrev=0 --match "v*" "origin/$CANDIDATE_NAME")
                   
                   if [ "$CANDIDATE_BASE" == "${{ inputs.upstream_tag }}" ]; then
                      echo "✅ Branch $CANDIDATE_NAME is already based on ${{ inputs.upstream_tag }}."
                      SKIP_REBASE="true"
                   else
                      echo "⚠️ Branch exists, but based on $CANDIDATE_BASE (expected ${{ inputs.upstream_tag }}). Will re-rebase."
                   fi
                fi
                
                echo "skip_rebase=$SKIP_REBASE" >> $SOURCECRAFT_ENV

          - name: checkout-candidate
            script:
              - |
                set -ex
                if [ "$skip_rebase" == "true" ]; then
                   # Branch exists only on remote — create local tracking branch
                   git checkout -b "$candidate_name" "origin/$candidate_name"
                else
                   # Create (or reset) local branch from current HEAD (target_branch)
                   git checkout -B "$candidate_name"
                fi
          - name: do-rebase
            script:
              - |
                set -ex

                if [ "$skip_rebase" == "true" ]; then
                   echo "⏭️ Branch is up-to-date. Skipping rebase."
                   exit 0
                fi

                if git rebase --onto "${{ inputs.upstream_tag }}" "$old_base" "$candidate_name"; then
                  echo "Rebase is done successfully."
                else
                  echo "::error::Rebase is failed due to conflicts."
                  echo "::notice::Manual intervention required. Please rebase locally."
                  git rebase --abort
                  exit 1
                fi
          - name: push-rebase-branch
            script:
                - |
                  set -ex
                  if [ "$skip_rebase" == "true" ]; then
                    exit 0
                  fi                  
                  git push origin "$candidate_name" --force
          - name: create-rebase-pr
            script:
              - |
                set -ex

                # If the candidate branch already existed and was up-to-date,
                # a PR may already exist — skip creation to avoid duplicates.
                if [ "$skip_rebase" == "true" ]; then
                  echo "⏭️ Candidate is up-to-date. Skipping PR creation."
                  exit 0
                fi

                TITLE="Rebase ${{ inputs.target_branch }} on ${{ inputs.upstream_tag }}"
                DESCRIPTION="### 🤖 Automated Rebase PR
                
                **Type:** Manual resolution or Auto-rebase
                **Branch:** ${{ inputs.target_branch }}
                **Upstream Tag:** ${{ inputs.upstream_tag }}
                
                ---
                ⚠️ **DO NOT MERGE MANUALLY**
                1. Wait for checks to pass.
                2. Use the **Apply Rebase** pipeline to finalize."

                DESCRIPTION_ESCAPED=$(printf '%s' "$DESCRIPTION" | sed ':a;N;$!ba;s/\n/\\n/g')

                curl --insecure -X POST \
                  -H "Authorization: Bearer $SOURCECRAFT_TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "{
                    \"source_branch\": \"$candidate_name\",
                    \"target_branch\": \"${{ inputs.target_branch }}\",
                    \"title\": \"$TITLE\",
                    \"description\": \"$DESCRIPTION_ESCAPED\",
                    \"publish\": true
                  }" \
                  "https://public-api.o.cloud.yandex.net/repos/yc/clickhouse/pulls"

  auto_rebase_check:
    inputs:
      target_branch:
        description: 'Branch to rebase (e.g. yc/master, yc/25.12) or "all" for all yc/* branches'
        required: false
        default: 'all'
        type: string
      create_pr:
        description: 'Create candidate branch and PR (true = full rebase + PR, false = dry-run check only)'
        required: false
        default: 'false'
        type: string

    tasks:
      - name: rebase-check
        checkout:
          enabled: false
        env:
          GIT_SSL_NO_VERIFY: 1
          CLICKHOUSE_UPSTREAM_REPO: https://github.com/ClickHouse/ClickHouse.git
          INPUT_BRANCH: ${{ inputs.target_branch }}
          CREATE_PR: ${{ inputs.create_pr }}
        cubes:
          - name: configure-git
            script:
              - |
                git config --global user.name 'CI Bot'
                git config --global user.email 'cibot@example.com'

          - name: clone-repo
            script:
              - |
                set -euo pipefail
                git clone https://git:$SOURCECRAFT_TOKEN@git.o.cloud.yandex.net/yc/clickhouse.git .
                git fetch --tags --quiet

          - name: run-rebase-loop
            script:
              - |
                set -euo pipefail

                ALLOWED_SUFFIXES=("stable" "lts")

                echo "Mode: $([ "$CREATE_PR" = "true" ] && echo "full (create PR)" || echo "dry-run (check only)")"

                get_latest_tag() {
                  local release_line=$1
                  local patterns=()
                  for suffix in "${ALLOWED_SUFFIXES[@]}"; do
                    if [[ "$release_line" == "master" ]]; then
                      patterns+=("v*-${suffix}")
                    else
                      patterns+=("v${release_line}.*-${suffix}")
                    fi
                  done
                  echo "  [DEBUG] get_latest_tag: release_line=$release_line patterns=${patterns[*]}" >&2
                  local result count
                  result=$(git tag -l "${patterns[@]}" --sort=-v:refname | head -n 1)
                  count=$(git tag -l "${patterns[@]}" | wc -l)
                  echo "  [DEBUG] get_latest_tag: total_matching=$count result='$result'" >&2
                  echo "  [DEBUG] get_latest_tag: first 5 tags:" >&2
                  git tag -l "${patterns[@]}" --sort=-v:refname | head -n 5 >&2
                  echo "$result"
                }

                declare -a BRANCHES
                if [[ "$INPUT_BRANCH" == "all" ]]; then
                  mapfile -t BRANCHES < <(git ls-remote --heads origin | awk '{print $2}' | sed 's|refs/heads/||' | grep -E '^yc/(master|[0-9]+\.[0-9]+)$')
                else
                  BRANCHES=("$INPUT_BRANCH")
                fi

                echo "Branches to check: ${BRANCHES[*]}"
                FAILED_BRANCHES=()

                for BRANCH in "${BRANCHES[@]}"; do
                  echo -e "\n========================================="
                  echo "Processing branch: $BRANCH"
                  echo "========================================="

                  git fetch origin "$BRANCH" --quiet

                  OLD_BASE=$(git describe --tags --abbrev=0 --match "v*" "origin/$BRANCH" 2>/dev/null || true)
                  if [[ -z "$OLD_BASE" ]]; then
                    echo "::warning::No upstream tag found on $BRANCH, skipping."
                    continue
                  fi
                  echo "Current base: $OLD_BASE"

                  RELEASE_LINE=${BRANCH#yc/}

                  LATEST_TAG=$(get_latest_tag "$RELEASE_LINE")
                  if [[ -z "$LATEST_TAG" ]]; then
                    echo "::warning::No upstream tag found for release line $RELEASE_LINE, skipping."
                    continue
                  fi
                  echo "Latest upstream tag: $LATEST_TAG"

                  if [[ "$OLD_BASE" == "$LATEST_TAG" ]]; then
                    echo "✅ $BRANCH is already based on $LATEST_TAG, nothing to do."
                    continue
                  fi

                  echo "⚠️ $BRANCH needs rebase: $OLD_BASE → $LATEST_TAG"
                  CANDIDATE="yc/rebase/${RELEASE_LINE}/${LATEST_TAG}"

                  if git ls-remote --exit-code --heads origin "$CANDIDATE" >/dev/null 2>&1; then
                    echo "ℹ️ Candidate branch $CANDIDATE already exists. Skipping."
                    continue
                  fi

                  # ================= DRY-RUN MODE =================
                  if [[ "$CREATE_PR" != "true" ]]; then
                    echo "⏳ Starting dry-run rebase..."
                    git checkout --detach "origin/$BRANCH" --quiet
                    
                    if git rebase --onto "$LATEST_TAG" "$OLD_BASE" HEAD >/dev/null 2>&1; then
                      echo "✅ Dry-run rebase of $BRANCH onto $LATEST_TAG succeeded."
                    else
                      git rebase --abort || true
                      echo "::error::Dry-run rebase of $BRANCH onto $LATEST_TAG has CONFLICTS."
                      FAILED_BRANCHES+=("$BRANCH")
                    fi
                    
                    git reset --hard HEAD --quiet
                    continue
                  fi

                  # ================= FULL MODE (Create PR) =================
                  echo "⏳ Starting full rebase and PR creation..."
                  git checkout -B "$CANDIDATE" "origin/$BRANCH" --quiet
                  
                  if git rebase --onto "$LATEST_TAG" "$OLD_BASE" "$CANDIDATE" >/dev/null 2>&1; then
                    git push origin "$CANDIDATE" --force --quiet
                    PR_TITLE="[Auto-rebase] $BRANCH → $LATEST_TAG"
                    PR_DESC="### 🤖 Automated Rebase PR
                
                **Type:** Auto-rebase
                **Branch:** $BRANCH
                **Previous Base:** $OLD_BASE
                **Upstream Tag:** $LATEST_TAG
                
                ---
                ⚠️ **DO NOT MERGE MANUALLY**
                1. Wait for checks to pass.
                2. Use the **Apply Rebase** pipeline to finalize."
                  else
                    git rebase --abort || true
                    git checkout -B "$CANDIDATE" "origin/$BRANCH" --quiet
                    git push origin "$CANDIDATE" --force --quiet
                    
                    PR_TITLE="[Auto-rebase CONFLICT] $BRANCH → $LATEST_TAG"
                    PR_DESC="### ⚠️ Rebase Conflict — Manual Fix Required
                
                **Type:** Manual resolution
                **Branch:** $BRANCH
                **Previous Base:** $OLD_BASE
                **Upstream Tag:** $LATEST_TAG
                
                Rebase failed with conflicts. Please:
                1. \`git fetch origin && git checkout $CANDIDATE\`
                2. \`git rebase --onto $LATEST_TAG $OLD_BASE\`
                3. Resolve conflicts, then \`git push origin $CANDIDATE --force\`
                4. CI will re-run tests automatically."
                    
                    FAILED_BRANCHES+=("$BRANCH")
                  fi

                  PR_DESC_ESCAPED=$(printf '%s' "$PR_DESC" | sed ':a;N;$!ba;s/\n/\\n/g')

                  curl --insecure -sS -X POST \
                    -H "Authorization: Bearer $SOURCECRAFT_TOKEN" \
                    -H "Content-Type: application/json" \
                    -d "{
                      \"source_branch\": \"$CANDIDATE\",
                      \"target_branch\": \"$BRANCH\",
                      \"title\": \"$PR_TITLE\",
                      \"description\": \"$PR_DESC_ESCAPED\",
                      \"publish\": true
                    }" \
                    "https://public-api.o.cloud.yandex.net/repos/yc/clickhouse/pulls"

                  echo "✅ PR created: $PR_TITLE"
                  git checkout --detach HEAD --quiet
                done

                # ================= FINALIZE =================
                if [[ ${#FAILED_BRANCHES[@]} -gt 0 ]]; then
                  echo -e "\n❌ The following branches have rebase conflicts:\n"
                  for fb in "${FAILED_BRANCHES[@]}"; do echo "  - $fb"; done
                  
                  if [[ "$CREATE_PR" == "true" ]]; then
                    echo "::error::PRs created for conflicting branches. Manual resolution required."
                  else
                    echo "::error::Dry-run conflicts detected. Manual intervention required before creating PRs."
                  fi
                  exit 1
                fi

                echo -e "\n✅ All branches processed successfully."

  do_rebase_poller:
    tasks:
      - name: poll-and-apply
        checkout:
          enabled: false
        env:
          GIT_SSL_NO_VERIFY: 1
          API_BASE: https://public-api.o.cloud.yandex.net
          ORG_SLUG: yc
          REPO_SLUG: clickhouse
          REBASE_LABEL: do-rebase
        cubes:
          - name: clone-repo
            script:
              - |
                set -ex
                git clone --depth=1 --branch yc/master \
                  https://git:$SOURCECRAFT_TOKEN@git.o.cloud.yandex.net/yc/clickhouse.git .

          - name: run-poller
            script:
              - python3 .sourcecraft/scripts/do_rebase_poller.py

  fast_test_workflow:
    runs_on: self-hosted
    settings:
      max_cube_duration: 6h
    tasks:
      - name: fast_test
        checkout:
          enabled: false
        env:
          GIT_SSL_NO_VERIFY: 1
        cubes:
          - name: configure-git
            script:
              - |
                git config --global user.name 'CI Bot'
                git config --global user.email 'cibot@example.com'
          
          - name: checkout
            script:
              - |
                set -ex
                git clone --branch yc/master https://git:$SOURCECRAFT_TOKEN@git.o.cloud.yandex.net/yc/clickhouse.git .
                git checkout $SOURCECRAFT_COMMIT_REF

          - name: fast_test
            script:
              - python3 -m ci.praktika run "Fast test"

