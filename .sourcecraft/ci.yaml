      max_cube_duration: 6h
    tasks:
      - name: build_amd_debug
        runs_on: [self-hosted, large]
        checkout:
          enabled: false
        env:
          GIT_SSL_NO_VERIFY: 1
          CLICKHOUSE_BINARY_PATH: ci/tmp/build/programs/self-extracting/clickhouse
        cubes:
          - name: configure-git
            uses: configure-git
          - name: checkout
            uses: checkout-shallow
          - name: setup-sccache
            uses: setup-sccache
          - name: style-check
            script:
              - python3 -m ci.praktika run "Style check"
          - name: build-debug
            script:
               - python3 -m ci.praktika run "Build (amd_debug)" --sccache
               - ls ci/tmp/build/programs/
          - name: upload-binary
            script:
