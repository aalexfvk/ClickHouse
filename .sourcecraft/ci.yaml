on:
  schedule:
    - workflows: sync_upstream
      cron: "0 9 * * *"
      description: "every day at 9:00 AM"

  # push:
  #   - workflows: [tests_workflow]
  #     filter:
  #       branches: ["yc/rebase/**"]

  pull_request:
    - workflows: [tests_workflow]
      filter:
        target_branches: ["yc/master"]

  pull_request:
    - workflows: [tests_workflow]
      filter:
        source_branches: "yc/rebase/**"
        target_branches: ["yc/**"]
  
  pull_request:
    - workflows: [tests_workflow]
